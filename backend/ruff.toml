# Ruff configuration — fast Python linter + formatter
target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
    "SIM108", # ternary operator (prefer explicit for readability)
]

[lint.per-file-ignores]
"tests/**" = ["S101"]  # assert statements OK in tests

[format]
quote-style = "double"
indent-style = "space"
